 <img src="images/banner.png" alt="banner" width="100%" height="500"> 

    <main class="container">

        <h1>Contact Dita Delicious Food</h1>

        <p>
            We would love to hear from you. Please fill in the form below
            to contact Dita Delicious Food for food orders, enquiries,
            feedback or other information.
        </p>


        <form class="contact-form">


            <label>

                Full Name

                <input type="text" name="fullname" placeholder="Enter your full name">

            </label>


            <label>

                Email Address

                <input type="email" name="email" placeholder="Enter your email address">

            </label>


            <label>

                Phone Number

                <input type="tel" name="phone" placeholder="Enter your phone number">

            </label>


            <label>

                Message

                <textarea
                    name="message" placeholder="Write your food order or message here"></textarea>

            </label>


            <button type="submit" class="submit-button"> Submit </button>


        </form>

    </main>


    <footer>

        <p>DITA DELICIOUS FOOD</p>

        <p>
            Contact: 09074002226 | 08056823846
        </p>

    </footer>
